
services:
  lucy-db:
    image: pgvector/pgvector:pg15
    container_name: lucy_postgres
    restart: always
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lucy_db
    ports:
      - "5432:5432"
    volumes:
      - lucy_pgdata:/var/lib/postgresql/data

volumes:
  lucy_pgdata:
